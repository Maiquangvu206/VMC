<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VMC - Visual & Media Club | Câu Lạc Bộ Nghệ Thuật & Truyền Thông</title>
    <meta name="description" content="Website chính thức của VMC - Câu lạc bộ Nghệ thuật, Âm nhạc, Nhiếp ảnh, Phim ảnh & Truyền thông Đa phương tiện." />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('VMC_THEME') || 'light';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-blue-600 selection:text-white">
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#64748b;font-family:system-ui,sans-serif;font-size:14px;">
        Đang tải VMC Portal...
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
