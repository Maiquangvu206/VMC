# VMC Portal (Laravel) — Render Blueprint
services:
  - type: web
    name: vmc-portal-laravel
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      # Tránh phụ thuộc bảng sessions/cache trên Supabase pooler: dùng file cho ổn định.
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file

      # --- Database (PostgreSQL / Supabase) ---
      # Ưu tiên DATABASE_URL (session pooler port 5432) để Laravel dùng prepared statements ổn định.
      # Nếu dùng Supabase pooler: host dạng aws-0-<region>.pooler.supabase.com,
      # username dạng postgres.<project-ref>, DB_DATABASE=postgres, DB_SSLMODE=require.
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_SSL
        value: "true"
      # Giữ kết nối PDO giữa các request (mỗi PHP worker 1 kết nối) để khỏi
      # bắt tay SSL với Supabase pooler mỗi lần gọi API.
      - key: DB_PERSISTENT
        value: "true"
      # Tự động chạy migrate khi container khởi động (idempotent).
      # Đặt "false" nếu muốn migrate thủ công qua Render Shell.
      - key: RUN_MIGRATIONS
        value: "true"

      # --- Mail: 2 loại (system + notification), SMTP hoặc HTTPS provider ---
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SYSTEM_MAILER
        value: auth_smtp
      - key: MAIL_NOTIFICATION_MAILER
        value: task_smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_ENCRYPTION
        value: ssl
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_AUTH_USERNAME
        sync: false
      - key: MAIL_AUTH_PASSWORD
        sync: false
      - key: MAIL_TASK_USERNAME
        sync: false
      - key: MAIL_TASK_PASSWORD
        sync: false
      - key: MAIL_SYSTEM_FROM_ADDRESS
        sync: false
      - key: MAIL_SYSTEM_FROM_NAME
        sync: false
      - key: MAIL_NOTIFICATION_FROM_ADDRESS
        sync: false
      - key: MAIL_NOTIFICATION_FROM_NAME
        sync: false
      # HTTPS mail providers (nếu dùng resend/postmark/ses/brevo)
      - key: RESEND_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: POSTMARK_TOKEN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
