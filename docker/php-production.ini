; Cấu hình PHP production cho Render (php artisan serve = PHP built-in server).
; Không có opcache, mỗi request phải biên dịch lại toàn bộ framework (~10s trên CPU yếu).
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
; Image đã build cố định, không cần kiểm tra file mtime mỗi request.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1

realpath_cache_size=4096K
realpath_cache_ttl=600

expose_php=Off
memory_limit=512M
max_execution_time=120
