name: Deploy VMC Application

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Frontend
        run: |
          npm install
          npm run build

      - name: Deploy Frontend to Nginx
        run: |
          sudo rm -rf /var/www/VMC/dist/*
          sudo cp -rf dist/* /var/www/VMC/dist/
          sudo chown -R www-data:www-data /var/www/VMC/dist
          sudo systemctl reload nginx

      - name: Setup Laravel Backend
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader || true
          php artisan migrate --force || true
          php artisan config:clear || true
          php artisan route:clear || true

      - name: Restart Server with PM2
        run: |
          export PATH=$PATH:$HOME/.nvm/versions/node/$(node -v)/bin:$HOME/.npm-global/bin:/usr/local/bin
          if command -v pm2 &> /dev/null; then
            pm2 restart ecosystem.config.cjs || pm2 start ecosystem.config.cjs
            pm2 save
          else
            npx pm2 restart ecosystem.config.cjs || npx pm2 start ecosystem.config.cjs
            npx pm2 save
          fi
          echo "=========================================="
          echo "🎉 Deploy thành công! Laravel Server đang chạy."
          echo "=========================================="

      - name: Check PM2 logs
        run: |
          export PATH=$PATH:$HOME/.nvm/versions/node/$(node -v)/bin:$HOME/.npm-global/bin:/usr/local/bin
          sleep 5
          (pm2 logs vmc-laravel --lines 30 --nostream || npx pm2 logs vmc-laravel --lines 30 --nostream) || true

      - name: Health check
        run: |
          sleep 3
          curl -I http://localhost:8000/api/members || curl -I http://localhost:5000/api/members || echo "⚠️ Server chưa phản hồi được /api/members"